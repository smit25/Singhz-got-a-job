# ─────────────────────────────────────────────────────────────────────────────
# TRACKED COMPANIES (optional)
#
# Add specific companies here to scan them directly via their ATS API.
# This is faster and more reliable than WebSearch — results are real-time,
# not Google-cached.
#
# scan.mjs uses this section for zero-token API scanning (Greenhouse, Ashby, Lever).
# The /singhz-got-a-job scan Claude agent also uses it for Playwright-based scanning.
#
# HOW TO ADD A COMPANY:
#
# Greenhouse company:
#   - name: Company Name
#     careers_url: https://job-boards.greenhouse.io/{slug}
#     api: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs
#     enabled: true
#
# Ashby company:
#   - name: Company Name
#     careers_url: https://jobs.ashbyhq.com/{slug}
#     enabled: true
#
# Lever company:
#   - name: Company Name
#     careers_url: https://jobs.lever.co/{slug}
#     enabled: true
#
# Any company (Playwright scraping):
#   - name: Company Name
#     careers_url: https://company.com/careers
#     scan_method: playwright
#     enabled: true
#
# Leave this list empty to rely purely on search_queries above.
# ─────────────────────────────────────────────────────────────────────────────

tracked_companies: []
