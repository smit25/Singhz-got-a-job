                  - strong [ref=e185]: Cover letter
                - textbox "Cover letter" [ref=e188]: "GPU-poor and proud of it 🤗 At Hugging Face, open-source isn't just a distribution model — it's a philosophy about who gets to build with AI. That's why I want to work here. My path into ML has consistently pushed me toward making systems usable beyond my own team. At Anote AI, I built a multimodal synthetic data engine and shipped it as a PyPI package — not because it was required, but because the engineering decisions that make a library maintainable and composable are more interesting than the ones that keep code private. I wrote it with a clean external API surface, handled versioning, and documented it for users I'd never meet. That pattern shows up in my research too. My IEEE paper on imputation methods wasn't just about proving Gaussian Copula was the better algorithm — it was about building a reproducible benchmark that other teams could run on their own data. Open methodology is how you find out whether your results actually hold. I use the transformers library regularly: fine-tuning on low-resource domains at Anote AI, building retrieval pipelines, evaluating embedding quality. I want to contribute to these problems directly, not just consume the library's work. Specifically, I'm interested in contributing to evaluation tooling and synthetic data generation utilities — areas where I have production experience and where I see real gaps in the ecosystem. I'm finishing my MS CS at NYU in May 2026 and can start immediately. I'd bring production instinct from shipping ML systems that external teams rely on, a focus on data quality (self-supervised correction loops, 35% quality improvement), and the habit of publishing methodology openly."
