# Form Answer Bank — your reusable application Q&A
# Updated by batch-apply / apply when you answer new questions.
# Edit manually anytime. See templates/form-answers.example.yml for format.

answers:
  - id: salary_expectation
    scope: shared
    match:
      - salary
      - compensation
      - desired pay
      - expected base
      - pay range
    answer: "$120K-$150K base (USD), flexible on equity"
    updated: "2026-06-01"
    source: profile

  - id: visa_sponsorship
    scope: shared
    match:
      - require sponsorship
      - visa sponsorship
      - need sponsorship
      - will you now or in the future require
    answer: "Yes — F-1 OPT available May 2026; will require H-1B sponsorship"
    updated: "2026-06-01"
    source: profile

  - id: work_authorization
    scope: shared
    match:
      - work authorization
      - legally authorized to work
      - eligible to work in the us
      - authorized to work in the united states
    answer: "Yes, with sponsorship (F-1 OPT May 2026)"
    updated: "2026-06-01"
    source: profile

  - id: hear_about
    scope: shared
    match:
      - how did you hear
      - where did you hear
      - referral source
      - how did you find
    answer: "Company careers page / job board"
    updated: "2026-06-01"

  - id: relocation
    scope: shared
    match:
      - willing to relocate
      - open to relocation
      - relocate
    answer: "Open to relocation; based in New York, NY"
    updated: "2026-06-01"

  - id: remote_preference
    scope: shared
    match:
      - remote
      - work from home
      - hybrid
    answer: "Hybrid or remote preferred; open to on-site in NYC"
    updated: "2026-06-01"
    source: profile

